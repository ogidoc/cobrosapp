<script>
// IDB helper para sync con SW
window.CobrosIDB = {
  dbName:'cobros_db', store:'prestamos',
  open(){return new Promise((res,rej)=>{const r=indexedDB.open(this.dbName,1); r.onupgradeneeded=e=>{const db=e.target.result; if(!db.objectStoreNames.contains(this.store)) db.createObjectStore(this.store);}; r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);});},
  async save(data){try{const db=await this.open(); const tx=db.transaction(this.store,'readwrite'); tx.objectStore(this.store).put(data,'data'); return new Promise(r=>{tx.oncomplete=()=>r();});}catch(e){}},
  async get(){try{const db=await this.open(); const tx=db.transaction(this.store,'readonly'); const req=tx.objectStore(this.store).get('data'); return new Promise(r=>{req.onsuccess=()=>r(req.result||[]); req.onerror=()=>r([]);});}catch(e){return [];}}
};
window.syncToSW = async function(){
  try{
    const raw = localStorage.getItem('cobros_prestamos');
    if(raw){ 
      const arr=JSON.parse(raw); 
      await CobrosIDB.save(arr);
      // Guardar también en CobrosDB para compatibilidad vieja
      try{
        const req = indexedDB.open('CobrosDB', 1);
        req.onupgradeneeded = function(e){ try{ e.target.result.createObjectStore('datos'); }catch(x){} };
        req.onsuccess = function(e){
          try{ const db=e.target.result; const tx=db.transaction('datos','readwrite'); tx.objectStore('datos').put(arr,'prestamos'); }catch(x){}
        };
      }catch(x){}
    }
  }catch(e){}
};

// Notificaciones - VERSIÓN SIMPLE QUE FUNCIONA
window.CobrosNotif = {
  async pedirPermiso(){
    if(!('Notification' in window)){ alert('Este navegador no soporta notificaciones'); return false; }
    let perm = Notification.permission;
    if(perm==='granted') return true;
    if(perm==='denied'){ alert('Permiso bloqueado. Ve a Ajustes > Apps > Chrome > Notificaciones > Permitir'); return false; }
    perm = await Notification.requestPermission();
    return perm==='granted';
  },
  async probar(){
    console.log('Probar notificación - inicio');
    const ok = await this.pedirPermiso();
    if(!ok) return;
    // Intento 1: Notification directa (siempre funciona si hay permiso)
    try{
      const prestamos = JSON.parse(localStorage.getItem('cobros_prestamos')||'[]');
      const n = new Notification('Cobros - ¡Funciona! 🔔',{
        body:'Notificaciones activas. Tienes '+prestamos.length+' préstamos guardados. Si ves esto, el sistema funciona.',
        icon:'./icon-192.png',
        badge:'./icon-192.png',
        tag:'prueba-directa',
        requireInteraction:true
      });
      n.onclick = function(){ window.focus(); n.close(); };
      console.log('Notificación directa mostrada');
      // Cerrar después de 5s
      setTimeout(()=>{ try{n.close();}catch(e){} }, 5000);
    }catch(e){
      console.error('Error notificación directa:', e);
      alert('Error notificación directa: '+e.message+'\nProbando con Service Worker...');
    }
    // Intento 2: via SW (para fondo) - con timeout para no quedarse colgado
    try{
      const reg = await Promise.race([
        navigator.serviceWorker.ready,
        new Promise((_,rej)=>setTimeout(()=>rej(new Error('SW timeout')), 2000))
      ]);
      if(reg){
        await reg.showNotification('Prueba Fondo (SW) 🔔',{
          body:'Esta es la notificación que verás aunque cierres la app.',
          icon:'./icon-192.png',
          badge:'./icon-192.png',
          tag:'prueba-sw',
          vibrate:[200,100,200],
          data:{url:'./index.html#cobros'}
        });
        console.log('Notificación via SW mostrada');
      }
    }catch(e){
      console.log('SW no disponible para prueba (normal si no está instalado):', e.message);
    }
  },
  async programarDiarias(){
    const horaInput = document.getElementById('hora-notif-react');
    const hora = horaInput ? horaInput.value : (localStorage.getItem('cobros_notif_hora')||'08:00');
    localStorage.setItem('cobros_notif_hora', hora);
    const ok = await this.pedirPermiso();
    if(!ok) return false;
    localStorage.setItem('cobros_notif_activas','1');
    // Intentar registrar periodic sync pero no bloquear si falla
    try{
      const reg = await Promise.race([
        navigator.serviceWorker.ready,
        new Promise((res)=>setTimeout(()=>res(null), 1500))
      ]);
      if(reg && 'periodicSync' in reg){
        try{
          const status = await navigator.permissions.query({name:'periodic-background-sync'});
          if(status.state==='granted'){
            await reg.periodicSync.register('cobros-check',{minInterval: 12*60*60*1000});
          }
        }catch(e){}
      }
    }catch(e){}
    // Mostrar confirmación con notificación directa (no depende de SW)
    try{
      new Notification('Notificaciones activadas ✓',{
        body:'Te avisaré a las '+hora+' si hay cobros. Ya puedes cerrar la app.',
        icon:'./icon-192.png'
      });
    }catch(e){
      // fallback via SW si Notification directa falla
      try{
        const reg = await navigator.serviceWorker.ready;
        await reg.showNotification('Notificaciones activadas ✓',{
          body:'Te avisaré a las '+hora+' si hay cobros pendientes.',
          icon:'./icon-192.png',
          tag:'activacion-ok'
        });
      }catch(e2){}
    }
    return true;
  },
  async verificarHoy(){
    try{
      const raw = localStorage.getItem('cobros_prestamos');
      if(!raw){ alert('No hay préstamos guardados'); return 0; }
      const prestamos = JSON.parse(raw);
      const hoy = new Date();
      const diaHoy = hoy.getDate();
      const mes = hoy.getMonth();
      const anio = hoy.getFullYear();
      let cobros = [];
      prestamos.forEach(function(p){
        if(p.estado!=='activo') return;
        if((p.diaPago||1)!==diaHoy) return;
        const tienePago = (p.pagos||[]).some(function(pg){
          if(pg.tipo==='incremento') return false;
          const dt = new Date(pg.fecha);
          return dt.getMonth()===mes && dt.getFullYear()===anio;
        });
        if(!tienePago) cobros.push(p);
      });
      if(cobros.length>0){
        const ok = await this.pedirPermiso();
        if(ok){
          try{
            new Notification(cobros.length+' cobros HOY 🔔',{
              body: cobros.map(c=>c.cliente).slice(0,3).join(', ')+(cobros.length>3?' y '+(cobros.length-3)+' más':'')+' - Tienes cobros pendientes hoy.',
              icon:'./icon-192.png',
              requireInteraction:true
            });
          }catch(e){
            const reg = await navigator.serviceWorker.ready;
            await reg.showNotification(cobros.length+' cobros HOY',{
              body: cobros.map(c=>c.cliente).slice(0,2).join(', '),
              icon:'./icon-192.png',
              tag:'cobros-hoy'
            });
          }
        }
        return cobros.length;
      }else{
        // Mostrar aviso de que no hay cobros
        const ok = await this.pedirPermiso();
        if(ok){
          try{
            new Notification('Sin cobros hoy ✓',{
              body:'No tienes cobros pendientes para hoy ('+diaHoy+'). Todo al día.',
              icon:'./icon-192.png'
            });
          }catch(e){}
        }
        return 0;
      }
    }catch(e){ console.error('verificarHoy error', e); alert('Error: '+e.message); return 0; }
  }
};

window.addEventListener('load', async()=>{
  console.log('Load - registrando SW');
  if('serviceWorker' in navigator){
    try{
      const reg = await navigator.serviceWorker.register('./sw.js');
      console.log('SW registrado', reg.scope);
      // No esperar a ready para no bloquear
      navigator.serviceWorker.ready.then(r=>console.log('SW ready')).catch(e=>console.log('SW ready error', e));
      setTimeout(()=>{ window.syncToSW(); }, 1500);
    }catch(e){ console.error('SW fail',e); }
  }
  // Interceptar setItem para sync
  try{
    const _setItem = localStorage.setItem.bind(localStorage);
    localStorage.setItem = function(k,v){ _setItem(k,v); if(k==='cobros_prestamos'){ try{ window.syncToSW(); }catch(x){} } };
  }catch(e){}
});
</script>

<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script>
(function(){
"use strict";
var React = window.React;
var ReactDOM = window.ReactDOM;
var h = React.createElement;
var useState = React.useState;
var useEffect = React.useEffect;
var useMemo = React.useMemo;
var useRef = React.useRef;

// ÍCONO NEGRO SÓLIDO (PNG Base64 de 1x1 pixel, escalado por el manifest)
var ICON_PNG = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=";

function En(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36); }
function R(e){ if(!e||isNaN(e)) return "$0"; return new Intl.NumberFormat("es-CO",{style:"currency",currency:"COP",maximumFractionDigits:0}).format(Math.round(e)); }
function Pe(){ var e=new Date; return e.getFullYear()+"-"+String(e.getMonth()+1).padStart(2,"0")+"-"+String(e.getDate()).padStart(2,"0"); }
function Cn(e){ return new Date(e+"T12:00:00"); }
function Ue(e){
  if(!e) return "";
  var n = String(e).match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(n) return n[3]+"/"+n[2]+"/"+n[1];
  try{ var t=new Date(e); if(isNaN(t.getTime())) return e; return String(t.getDate()).padStart(2,"0")+"/"+String(t.getMonth()+1).padStart(2,"0")+"/"+t.getFullYear(); }catch(x){ return e; }
}
function Ra(e){ var n=new Date(e); if(isNaN(n.getTime())) return ""; return String(n.getDate()).padStart(2,"0")+"/"+String(n.getMonth()+1).padStart(2,"0"); }
function wn(e){
  if(!e) return 0;
  var n = String(e).replace(/[$\s]/g,"").trim();
  if(!n) return 0;
  var commaDecimal = /,\d{1,2}$/.test(n);
  var dotDecimal = /\.\d{1,2}$/.test(n) && !/\.\d{3}$/.test(n);
  if(commaDecimal){ n = n.replace(/\./g,"").replace(",","."); }
  else if(dotDecimal){ n = n.replace(/,/g,""); }
  else { n = n.replace(/[.,]/g,""); }
  var t = parseFloat(n);
  return isNaN(t) ? 0 : Math.round(t);
}
function Ma(e,n){ var t=new Date(e).getTime(),r=new Date(n).getTime(); if(isNaN(t)||isNaN(r)) return 0; return Math.max(0,Math.floor((r-t)/86400000)); }
function proximoPagoNoRealizado(prestamo){
  if(!prestamo) return Pe();
  var hoy = new Date();
  var y = hoy.getFullYear();
  var m = hoy.getMonth();
  var d = prestamo.diaPago || 5;
  // buscar desde fechaInicio hasta 12 meses adelante el primer mes sin pago
  var inicio = new Date(prestamo.fechaInicio);
  var yi = inicio.getFullYear();
  var mi = inicio.getMonth();
  var pagosPorMes = {};
  (prestamo.pagos||[]).forEach(function(p){
    var dt = new Date(p.fecha);
    var key = dt.getFullYear()+'-'+dt.getMonth();
    pagosPorMes[key]=true;
  });
  // empezar desde el mes del inicio, pero el siguiente pago es el mas antiguo sin pagar que ya venció o este mes
  // Para fecha por defecto: el mes más antiguo sin pago desde inicio hasta hoy+1, o si todos pagados, el próximo diaPago
  var cursorY = yi;
  var cursorM = mi;
  // avanzar hasta encontrar hueco
  for(var i=0;i<24;i++){
    var lastDay = new Date(cursorY, cursorM+1, 0).getDate();
    var diaReal = Math.min(d, lastDay);
    var expected = new Date(cursorY, cursorM, diaReal);
    var startOnlyDate = new Date(inicio.getFullYear(), inicio.getMonth(), inicio.getDate());
    var expOnlyDate = new Date(expected.getFullYear(), expected.getMonth(), expected.getDate());
    if(expOnlyDate > startOnlyDate){
      var key = cursorY+'-'+cursorM;
      if(!pagosPorMes[key]){
        // si es pasado o hoy, devolver ese
        // si es futuro pero es el primer hueco futuro, también
        var yyyy = cursorY;
        var mm = String(cursorM+1).padStart(2,'0');
        var dd = String(diaReal).padStart(2,'0');
        // si el hueco es en el pasado, devolver hoy? No, devolver la fecha del hueco para que quede registro real
        return yyyy+'-'+mm+'-'+dd;
      }
    }
    cursorM++; if(cursorM>11){cursorM=0; cursorY++;}
  }
  // si todos pagados, siguiente mes
  var nextY = y, nextM = m;
  if(hoy.getDate() > d){ nextM++; if(nextM>11){nextM=0; nextY++;} }
  var lastDayNext = new Date(nextY, nextM+1, 0).getDate();
  var diaNext = Math.min(d, lastDayNext);
  return nextY+'-'+String(nextM+1).padStart(2,'0')+'-'+String(diaNext).padStart(2,'0');
}
function interesMesCompleto(saldo, tasa){ return Math.round(saldo * (tasa/100)); }


function calcularDiasInteres(d) {
  if (d <= 0) return 0;
  var meses = Math.round(d / 30);
  if (meses > 0 && Math.abs(d - (meses * 30)) <= 2) {
    return meses * 30;
  }
  return d;
}

function kn(e){
  var n = e.pagos.slice().sort(function(u,i){ return new Date(u.fecha).getTime()-new Date(i.fecha).getTime(); });
  // Calcular montoInicial real si hay incrementos antes del inicio? No, montoInicial es base.
  // Para saldo, partimos de montoInicial y vamos aplicando incrementos y abonos
  var t = e.montoInicial;
  var r = e.fechaInicio;
  var l = [];
  var pendienteAcumulado = 0;
  for(var idx=0; idx<n.length; idx++){
    var u = n[idx];
    var tipo = u.tipo || "abono"; // compatibilidad con datos viejos
    var i = Ma(r, u.fecha);
    var iCalculo = calcularDiasInteres(i);
    var a = t * (e.tasa/100/30) * iCalculo + pendienteAcumulado;
    var g = u.abono;
    var A, y, S, E;
    if(tipo === "incremento"){
      // Incremento: no paga interés, solo aumenta saldo
      A = 0;
      y = 0;
      S = t + g;
      E = a; // todo el interés causado queda pendiente
      pendienteAcumulado = E;
      l.push({
        id: u.id, fecha: u.fecha, abono: g,
        interesCausado: a, interesPagado: A, abonoCapital: y,
        interesPendiente: E, saldoResultante: S, 
        diasTranscurridos: i, 
        diasCalculo: iCalculo,
        saldoAnterior: t, tasaEnMomento: e.tasa,
        tipo: "incremento"
      });
    } else {
      // Abono normal
      if(g >= a){ A=a; y=g-a; S=Math.max(0,t-y); E=0; pendienteAcumulado=0; }
      else { A=g; y=0; S=t; E=a-g; pendienteAcumulado=E; }
      l.push({
        id: u.id, fecha: u.fecha, abono: g,
        interesCausado: a, interesPagado: A, abonoCapital: y,
        interesPendiente: E, saldoResultante: S, 
        diasTranscurridos: i, 
        diasCalculo: iCalculo,
        saldoAnterior: t, tasaEnMomento: e.tasa,
        tipo: "abono"
      });
    }
    t = S; r = u.fecha;
  }
  return Object.assign({}, e, { pagos: l, saldo: t, estado: t <= 0 ? "pagado" : "activo" });
}
function Ha(){
  var hoy = new Date();
  function haceMeses(m){
    var d = new Date(hoy.getFullYear(), hoy.getMonth() - m, 5, 12, 0, 0);
    return d.toISOString();
  }
  var hoyISO = hoy.toISOString();
  var n = {
    id: "seed1", cliente: "Carlos Mendoza", montoInicial: 20000000, saldo: 20000000,
    tasa: 5, diaPago: 5, fechaInicio: haceMeses(2),
    notas: "Préstamo personal", estado: "activo", pagos: [], creado: hoyISO
  };
  var t = {
    id: "seed2", cliente: "Laura Gómez", montoInicial: 2000000, saldo: 2000000,
    tasa: 4, diaPago: 15, fechaInicio: haceMeses(1),
    estado: "activo", pagos: [], creado: hoyISO
  };
  return [kn(n), kn(t)];
}

function App(){
  var tabState = useState("prestamos"); var tab = tabState[0]; var setTab = tabState[1];
  var prestamosState = useState(function(){
    try {
      var saved = localStorage.getItem("cobros_prestamos");
      if(saved){
        var arr = JSON.parse(saved);
        if(Array.isArray(arr) && arr.length > 0){
          return arr.map(function(p){ try { return kn(p); } catch(x){ return p; } });
        }
      }
    } catch(x){}
    return Ha();
  });
  var prestamos = prestamosState[0]; var setPrestamos = prestamosState[1];

  var busquedaState = useState(""); var busqueda = busquedaState[0]; var setBusqueda = busquedaState[1];
  var filtroState = useState("todos"); var filtro = filtroState[0]; var setFiltro = filtroState[1];
  var ordenState = useState("proximoPago"); var orden = ordenState[0]; var setOrden = ordenState[1];
  var detalleIdState = useState(null); var detalleId = detalleIdState[0]; var setDetalleId = detalleIdState[1];
  var cobrosTabState = useState("hoy"); var cobrosTab = cobrosTabState[0]; var setCobrosTab = cobrosTabState[1];
  
  var nuevoFormState = useState({cliente:"", monto:"", tasa:"5", fecha:Pe(), notas:""});
  var nuevoForm = nuevoFormState[0]; var setNuevoForm = nuevoFormState[1];
  var pagoFormState = useState({abono:"", fecha:Pe()});
  var pagoForm = pagoFormState[0]; var setPagoForm = pagoFormState[1];
  var incrementoFormState = useState({monto:"", fecha:Pe()});
  var incrementoForm = incrementoFormState[0]; var setIncrementoForm = incrementoFormState[1];
  var tipoMovimientoState = useState("abono"); var tipoMovimiento = tipoMovimientoState[0]; var setTipoMovimiento = tipoMovimientoState[1];
  var editandoState = useState(false); var editando = editandoState[0]; var setEditando = editandoState[1];
  var editFormState = useState({cliente:"", tasa:"", monto:"", fecha:""});
  var editForm = editFormState[0]; var setEditForm = editFormState[1];
  var pagoAEliminarState = useState(null); var pagoAEliminar = pagoAEliminarState[0]; var setPagoAEliminar = pagoAEliminarState[1];
  var toastState = useState(""); var toast = toastState[0]; var setToast = toastState[1];
  var parserTextState = useState(""); var parserText = parserTextState[0]; var setParserText = parserTextState[1];
  var parserPreviewState = useState(null); var parserPreview = parserPreviewState[0]; var setParserPreview = parserPreviewState[1];
  var parserPrestamoIdState = useState(""); var parserPrestamoId = parserPrestamoIdState[0]; var setParserPrestamoId = parserPrestamoIdState[1];
  var backupsManualesState = useState([]); var backupsManuales = backupsManualesState[0]; var setBackupsManuales = backupsManualesState[1];
  var backupsAutoState = useState([]); var backupsAuto = backupsAutoState[0]; var setBackupsAuto = backupsAutoState[1];
  var autoBackupState = useState(false); var autoBackup = autoBackupState[0]; var setAutoBackup = autoBackupState[1];
  var proximosProgState = useState([]); var proximosProg = proximosProgState[0]; var setProximosProg = proximosProgState[1];
  var fileRef = useRef(null);
  var toastTimer = useRef(null);

  useEffect(function(){
    var meta = function(name, content, attr){
      attr = attr || "name";
      var el = document.querySelector('meta['+attr+'="'+name+'"]');
      if(!el){ el = document.createElement("meta"); el.setAttribute(attr, name); document.head.appendChild(el); }
      el.content = content;
    };
    meta("viewport","width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover");
    meta("theme-color","#000000");
    meta("apple-mobile-web-app-capable","yes");
    meta("apple-mobile-web-app-status-bar-style","black-translucent");

    // 1. Inyectar Manifest usando Data URI (Chrome lo acepta para instalación)
    var manifest = {
      name: "Cobros - Gestión de Préstamos",
      short_name: "Cobros",
      description: "Gestión de préstamos con desembolso como base de intereses",
      start_url: window.location.href,
      display: "standalone",
      background_color: "#ffffff",
      theme_color: "#000000",
      icons: [
        { src: ICON_PNG, sizes: "192x192", type: "image/png", purpose: "any maskable" },
        { src: ICON_PNG, sizes: "512x512", type: "image/png", purpose: "any maskable" }
      ]
    };
    var manifestDataUri = "data:application/manifest+json;charset=utf-8," + encodeURIComponent(JSON.stringify(manifest));
    var manifestLink = document.querySelector('link[rel="manifest"]');
    if(!manifestLink) { manifestLink = document.createElement('link'); manifestLink.rel = 'manifest'; document.head.appendChild(manifestLink); }
    manifestLink.href = manifestDataUri;

    // SW se registra externamente desde sw.js (ver window.load)
    // No registrar blob SW aquí para evitar conflicto
  }, []);

  // Guardar datos en IndexedDB para el Service Worker
  useEffect(function(){
    if ('indexedDB' in window) {
      var req = indexedDB.open('CobrosDB', 1);
      req.onupgradeneeded = function(e) { e.target.result.createObjectStore('datos'); };
      req.onsuccess = function(e) {
        var db = e.target.result;
        var tx = db.transaction('datos', 'readwrite');
        tx.objectStore('datos').put(prestamos, 'prestamos');
      };
    }
    try { localStorage.setItem("cobros_prestamos", JSON.stringify(prestamos)); } catch(x){}
  }, [prestamos]);

  useEffect(function(){
    try { localStorage.setItem("cobros_proximos_pagos", JSON.stringify(proximosProg)); } catch(x){}
  }, [proximosProg]);

  useEffect(function(){
    try {
      var manual = JSON.parse(localStorage.getItem("cobros_manual_backups") || "[]");
      var auto = JSON.parse(localStorage.getItem("cobros_auto_backups") || "[]");
      var enabled = localStorage.getItem("cobros_auto_enabled");
      var prox = JSON.parse(localStorage.getItem("cobros_proximos_pagos") || "[]");
      setBackupsManuales(manual); setBackupsAuto(auto);
      if(enabled) setAutoBackup(enabled === "true");
      setProximosProg(prox);
    } catch(x){}

  var cobros = useMemo(function(){
    var result = [];
    var now = new Date();
    var anioActual = now.getFullYear();
    var mesActual = now.getMonth();
    var diaHoy = now.getDate();

    var activos = prestamos.filter(function(p){ return p.estado === "activo"; });

    activos.forEach(function(p){
      var fechaInicio = new Date(p.fechaInicio);
      var y = fechaInicio.getFullYear();
      var m = fechaInicio.getMonth();
      
      var limitY = anioActual;
      var limitM = mesActual + 1;
      if (limitM > 11) { limitM = 0; limitY++; }

      var pendingMonths = 0;
      var totalInterest = 0;
      var oldestPendingDate = null;

      while (y < limitY || (y === limitY && m < limitM)) {
        var lastDay = new Date(y, m + 1, 0).getDate();
        var actualDiaPago = Math.min(p.diaPago, lastDay);
        var expectedDate = new Date(y, m, actualDiaPago);
        
        var startD = new Date(fechaInicio.getFullYear(), fechaInicio.getMonth(), fechaInicio.getDate());
        var expD = new Date(expectedDate.getFullYear(), expectedDate.getMonth(), expectedDate.getDate());
        
        if (expD > startD) {
          var isPaid = p.pagos.some(function(pago) {
            var d = new Date(pago.fecha);
            return d.getMonth() === m && d.getFullYear() === y;
          });
          
          if (!isPaid) {
            pendingMonths++;
            totalInterest += (p.saldo * p.tasa / 100);
            if (!oldestPendingDate) {
              oldestPendingDate = expectedDate;
            }
          }
        }
        m++;
        if (m > 11) { m = 0; y++; }
      }

      if (pendingMonths > 0) {
        var estado = "proximo";
        var timeDiff = oldestPendingDate.getTime() - now.getTime();
        var dayDiff = Math.ceil(timeDiff / (1000 * 3600 * 24));

        var oldestD = new Date(oldestPendingDate.getFullYear(), oldestPendingDate.getMonth(), oldestPendingDate.getDate());
        var todayD = new Date(now.getFullYear(), now.getMonth(), now.getDate());

        if (oldestD < todayD) {
          estado = "vencido";
        } else if (oldestD.getTime() === todayD.getTime()) {
          estado = "hoy";
        } else {
          if (dayDiff <= 7) {
            estado = "proximo";
          } else {
            estado = "ignore";
          }
        }

        if (estado !== "ignore") {
          result.push({
            id: p.id,
            prestamoId: p.id,
            cliente: p.cliente,
            saldo: p.saldo,
            tasa: p.tasa,
            diaPago: p.diaPago,
            fechaEsperada: oldestPendingDate,
            fechaEsperadaStr: String(oldestPendingDate.getDate()).padStart(2,"0") + "/" + String(oldestPendingDate.getMonth()+1).padStart(2,"0") + "/" + oldestPendingDate.getFullYear(),
            mesesAdeudados: pendingMonths,
            montoTotal: totalInterest,
            estado: estado
          });
        }
      }
    });

    var hoyList = result.filter(function(c){ return c.estado === "hoy"; });
    var proximosList = result.filter(function(c){ return c.estado === "proximo"; });
    var vencidosList = result.filter(function(c){ return c.estado === "vencido"; });

    var sortFn = function(a,b) { return a.fechaEsperada.getTime() - b.fechaEsperada.getTime(); };
    hoyList.sort(sortFn);
    proximosList.sort(sortFn);
    vencidosList.sort(sortFn);

    return { hoy: hoyList, proximos: proximosList, vencidos: vencidosList };
  }, [prestamos]);

  var procesarParser = function(){
    var txt = parserText.trim();
    if(!txt){ alert("Pega líneas en el textarea"); return; }
    var lineas = txt.split("\n").map(function(l){ return l.trim(); }).filter(function(l){ return l.length > 0; });
    var parseadas = [];
    
    for(var idx=0; idx<lineas.length; idx++){
      var l = lineas[idx];
      
      if (/fecha/i.test(l) && /inter[eé]s/i.test(l)) continue;

      var m = l.match(/(\d{1,2})[\/\-\.](\d{1,2})[\/\-\.](\d{2,4})/);
      if(!m) continue;
      
      var dd = parseInt(m[1],10), mm = parseInt(m[2],10), yy = parseInt(m[3],10);
      if(yy < 100) yy += 2000;
      if(mm < 1 || mm > 12 || dd < 1 || dd > 31) continue;
      
      var iso = yy + "-" + String(mm).padStart(2,"0") + "-" + String(dd).padStart(2,"0");
      var resto = l.replace(m[0], " ");
      
      var nums = (resto.match(/\$?\s*\d[\d\.\,]*/g) || []).map(function(x){ return wn(x); }).filter(function(x){ return !isNaN(x); });
      
      if(nums.length === 0) continue;
      
      var abono = 0;
      if (nums.length >= 3) {
          abono = nums[1];
      } else if (nums.length === 2) {
          abono = nums[0];
      } else if (nums.length === 1) {
          continue;
      }
      
      if(abono <= 0) continue;
      
      parseadas.push({
        id: En(),
        fechaStr: String(dd).padStart(2,"0")+"/"+String(mm).padStart(2,"0")+"/"+yy,
        fechaISO: iso,
        fechaISOFull: Cn(iso).toISOString(),
        abono: abono,
        raw: l,
        short: String(dd).padStart(2,"0")+"/"+String(mm).padStart(2,"0")
      });
    }
    
    if(parseadas.length === 0){ alert("No se detectaron líneas de abonos válidas. Verifica que las columnas estén separadas."); return; }
    
    var hoy = Pe();
    var pasados = parseadas.filter(function(x){ return x.fechaISO <= hoy; });
    var futuros = parseadas.filter(function(x){ return x.fechaISO > hoy; });
    setParserPreview({ pasados: pasados, futuros: futuros });
  };
